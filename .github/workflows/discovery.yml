name: Native project folder discovery
on:
  push:
    branches: [codex/project-discovery-verify]
  workflow_dispatch:
    inputs:
      target:
        description: Native target
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-x64]
permissions:
  contents: read
jobs:
  discovery:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows-x64' && '[{"os":"windows-latest","target":"windows-x64"}]' || inputs.target == 'macos-arm64' && '[{"os":"macos-15","target":"macos-arm64"}]' || inputs.target == 'macos-x64' && '[{"os":"macos-15-intel","target":"macos-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"windows-latest","target":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: rustup show
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run check:locales
      - run: npm run typecheck
      - run: npm test
      - name: Isolated real Laravel runtimes and preservation fixture
        run: cargo run --release -p devforge-workspace --example native_workspace --features test-support -- discovery-fixture empty-cache
      - name: Native watcher identity recovery and automatic Laravel HTTP
        run: target/release/examples/native_workspace discovery-native discovery-fixture
      - name: Native debug-only desktop with real IPC
        run: npm run tauri -- build --debug --no-bundle --features e2e
      - name: Actual Settings Projects localization and system folder picker
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
        run: python scripts/discovery_desktop_smoke.py discovery-fixture target/debug/devforge-desktop${{ runner.os == 'Windows' && '.exe' || '' }} target/release/examples/native_workspace${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python -m pip install -r scripts/requirements-knowledge.txt
      - run: python scripts/validate_knowledge.py --strict
      - name: Public reports and native screenshots only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: discovery-${{ matrix.target }}
          retention-days: 7
          path: |
            discovery-fixture/m5-native-result.json
            discovery-fixture/discovery-native-result.json
            discovery-fixture/discovery-desktop-result.json
            output/playwright/discovery/*.png
          if-no-files-found: warn
