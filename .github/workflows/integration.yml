name: Discovery M7 and current catalog integration
on:
  push:
    branches: [codex/discovery-m7-integration]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-x64]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.target == 'windows-x64' || contains(github.event.head_commit.message, '[windows-integration]')) && '[{"os":"windows-latest","target":"windows-x64"}]' || inputs.target == 'macos-arm64' && '[{"os":"macos-15","target":"macos-arm64"}]' || inputs.target == 'macos-x64' && '[{"os":"macos-15-intel","target":"macos-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"windows-latest","target":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: rustup show
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features devforge-workspace/test-support -- -D warnings
      - run: cargo test --workspace
      - run: npm run check:locales
      - run: npm run typecheck
      - run: npm test
      - name: Per-user isolated discovery fixtures
        run: python -c "import os,pathlib,tempfile; p=pathlib.Path(tempfile.gettempdir())/'devforge-integrated-discovery'; pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write('DISCOVERY_FIXTURE='+str(p)+'\n')"
      - name: Audit live current catalog packages and architectures
        run: python scripts/discovery_runtime_cache.py "${{ matrix.target }}" "${{ env.DISCOVERY_FIXTURE }}/archives"
      - name: Discovery real Laravel fixture
        run: cargo run --release -p devforge-workspace --example native_workspace --features test-support -- discovery-prepare "${{ env.DISCOVERY_FIXTURE }}" "${{ env.DISCOVERY_FIXTURE }}/archives"
      - name: Native watcher and Laravel recovery
        run: target/release/examples/native_workspace discovery-native "${{ env.DISCOVERY_FIXTURE }}"
      - name: Restore probed M7 SDKs by unchanged recipe
        id: sdk-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: xdebug-sdks/*.zip
          key: xdebug-${{ matrix.target }}-${{ hashFiles('crates/debugger/src/provider/build_runtime.py','crates/debugger/src/provider/recipe.json') }}
      - name: Ensure paired debug runtimes with existing production builder
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_debug_sdks.py ${{ matrix.target }} xdebug-sdks
      - name: Retain successfully probed SDKs for focused retries
        if: runner.os == 'macOS' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: xdebug-sdks/*.zip
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Fresh production downloader and current catalog Laravel fixture
        run: target/release/examples/native_workspace m7-integration-fixture empty-cache
      - name: Auto-discovered Laravel debugger profiler and Forget Restore
        run: target/release/examples/native_workspace debugger-discovery-native m7-integration-fixture xdebug-sdks
      - name: Native shared debugger CLI
        run: |
          cargo build --release -p devforge-cli --features test-support
          target/release/examples/native_workspace debugger-cli m7-integration-fixture target/release/devforge${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Actual integrated desktop
        run: npm run tauri -- build --debug --no-bundle --features e2e
      - name: Native discovery Settings and system picker
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
        run: python scripts/discovery_desktop_smoke.py "${{ env.DISCOVERY_FIXTURE }}" target/debug/devforge-desktop${{ runner.os == 'Windows' && '.exe' || '' }} target/release/examples/native_workspace${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Native debugger on automatically discovered project
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
        run: python scripts/m7_xdebug_desktop_smoke.py m7-integration-fixture target/debug/devforge-desktop target/release/examples/native_workspace
      - run: python -m pip install -r scripts/requirements-knowledge.txt
      - run: python scripts/validate_knowledge.py --strict
      - name: Stage public reports only
        if: always()
        run: python -c "import os,pathlib,shutil; s=pathlib.Path(os.environ['DISCOVERY_FIXTURE']); d=pathlib.Path('integration-reports'); d.mkdir(exist_ok=True); [shutil.copy2(s/n,d/n) for n in ['discovery-native-result.json','discovery-desktop-result.json','discovery-runtime-downloads.json'] if (s/n).exists()]"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integration-${{ matrix.target }}
          retention-days: 7
          path: |
            integration-reports/*.json
            m7-integration-fixture/m7-xdebug-*-result.json
            xdebug-sdks/*-provenance.json
            output/playwright/discovery/*.png
            output/playwright/m7-xdebug/*.png
