name: Native reproducible environments
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-x64]
permissions:
  contents: read
jobs:
  reproducible:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows-x64' && '[{"os":"windows-latest","target":"windows-x64"}]' || inputs.target == 'macos-arm64' && '[{"os":"macos-15","target":"macos-arm64"}]' || inputs.target == 'macos-x64' && '[{"os":"macos-15-intel","target":"macos-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"windows-latest","target":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show
      - name: Test real CLI with isolated fixture credential adapter
        run: cargo build --release -p devforge-cli --features test-support
      - name: Two machine stores, exact pins, redacted review and failure recovery
        run: cargo run --release -p devforge-workspace --example repro_smoke --features test-support -- target/release/devforge empty-cache m10-native-result.json
      - name: Preserve public acceptance report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m10-${{ matrix.target }}
          retention-days: 7
          path: m10-native-result.json
          if-no-files-found: warn
