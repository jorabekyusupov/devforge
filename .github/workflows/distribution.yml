name: Internal desktop distribution acceptance
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native packaging target
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-x64]
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows-x64' && '[{"os":"windows-latest","target":"windows-x64"}]' || inputs.target == 'macos-arm64' && '[{"os":"macos-15","target":"macos-arm64"}]' || inputs.target == 'macos-x64' && '[{"os":"macos-15-intel","target":"macos-x64"}]' || '[{"os":"macos-15","target":"macos-arm64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"windows-latest","target":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: rustup show
      - run: npm ci
      - run: python -m unittest scripts/test_distribution.py
      - name: Native real Laravel projects PostgreSQL queue and Vite fixture
        run: cargo run --release -p devforge-workspace --example native_workspace --features test-support -- m6-fixture empty-cache
      - name: Production release app sidecars notices SBOM DMG or NSIS
        run: python scripts/package_desktop.py
      - name: Actual installation replacement data preservation and release measurements
        id: package_acceptance
        continue-on-error: true
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
        run: target/release/examples/native_workspace run python scripts/m6_package_smoke.py m6-fixture --disposable-host
      - name: Native GUI and concurrent install/log frame measurements
        run: npm run tauri -- build --debug --no-bundle --features e2e
      - env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu
        run: python scripts/m5_desktop_smoke.py m6-fixture target/debug/devforge-desktop target/release/examples/native_workspace
      - name: Require successful installer acceptance after independent GUI checks
        if: always() && steps.package_acceptance.outcome == 'failure'
        run: python -c "raise SystemExit('Installer acceptance failed; independent native GUI evidence was still collected.')"
      - name: Preserve internal packages and public acceptance reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m6-${{ matrix.target }}-internal-unsigned
          retention-days: 7
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*-setup.exe
            output/distribution/*.json
            distribution/generated/distribution.json
            distribution/generated/sbom.cdx.json
            m6-fixture/m5-native-result.json
            m6-fixture/m5-desktop-result.json
            output/playwright/m5/*.png
