name: Temporary Windows internal package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aad1630a98075afedef66e022cb3b55c9e140607
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build unsigned Windows installer from exact main
        run: python scripts/package_desktop.py
      - name: Upload internal installer and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devforge-windows-x64-aad1630-internal-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            output/distribution/package-manifest.json
            distribution/generated/distribution.json
            distribution/generated/sbom.cdx.json
