name: Desktop and runtime core
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: all
        options: [all, core, native]
      native_target:
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-x64]
permissions:
  contents: read
jobs:
  scope-baseline:
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
      available: ${{ steps.baseline.outputs.available }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Find last ancestor validated on both platforms
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_baseline.py

  check:
    needs: scope-baseline
    env:
      DEVFORGE_CI_VALIDATED_BASE: ${{ needs.scope-baseline.outputs.sha }}
      DEVFORGE_CI_BASELINE_READY: ${{ needs.scope-baseline.outputs.available }}
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite != 'native') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select checks from changed paths
        id: scope
        run: python scripts/ci_scope.py
      - name: Prepare toolchain from rust-toolchain.toml
        if: steps.scope.outputs.product == 'true'
        run: rustup show
      - name: Select Rust packages and consumers
        if: steps.scope.outputs.product == 'true'
        id: rust_scope
        env:
          DEVFORGE_CI_RUST_SCOPE: ${{ runner.temp }}/devforge-rust-scope.json
        run: python scripts/rust_scope.py plan
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        with:
          node-version: '24.22.2'
          cache: npm
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: npm ci
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: python -m unittest scripts/test_distribution.py
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: npm run check:locales
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: node --test scripts/check_locales.test.mjs
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: npm test
      - name: Rust fmt for selected scope
        if: steps.scope.outputs.product == 'true'
        env:
          DEVFORGE_CI_RUST_SCOPE: ${{ runner.temp }}/devforge-rust-scope.json
        run: python scripts/rust_scope.py fmt
      - name: Rust clippy for selected scope
        if: steps.scope.outputs.product == 'true'
        env:
          DEVFORGE_CI_RUST_SCOPE: ${{ runner.temp }}/devforge-rust-scope.json
        run: python scripts/rust_scope.py clippy
      - name: Rust test for selected scope
        if: steps.scope.outputs.product == 'true'
        env:
          DEVFORGE_CI_RUST_SCOPE: ${{ runner.temp }}/devforge-rust-scope.json
        run: python scripts/rust_scope.py test
      - name: Build native desktop binary with embedded frontend
        if: steps.scope.outputs.product == 'true' && steps.rust_scope.outputs.frontend == 'true'
        run: npm run tauri -- build --debug --no-bundle
      - run: python -m unittest discover -s tests -p 'test_ci_*.py'
      - run: python -m unittest discover -s tests -p test_rust_scope.py
      - run: python -m pip install -r scripts/requirements-knowledge.txt
      - run: python scripts/validate_knowledge.py --strict

  xdebug-native:
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'core'
    uses: ./.github/workflows/xdebug.yml
    with:
      target: ${{ inputs.native_target || 'all' }}
