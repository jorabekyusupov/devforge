name: Desktop and runtime core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare toolchain from rust-toolchain.toml
        run: rustup show
      - run: npm ci
      - run: python -m unittest scripts/test_distribution.py
      - run: npm run check:locales
      - run: node --test scripts/check_locales.test.mjs
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build native desktop binary with embedded frontend
        run: npm run tauri -- build --debug --no-bundle
      - run: python -m pip install -r scripts/requirements-knowledge.txt
      - run: python scripts/validate_knowledge.py --strict

  xdebug-native:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/xdebug.yml
