[package]
name = "devforge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "devforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devforge-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio-webdriver", "devforge-workspace/test-support"]

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
devforge-core.workspace = true
devforge-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"

devforge-workspace.workspace = true
devforge-projects.workspace = true
devforge-runtime.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-wdio-webdriver = {version="1.5.1", optional=true}
