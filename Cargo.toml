[workspace]
members = ["crates/debugger", "crates/inspector", "crates/core", "crates/platform", "crates/runtime", "crates/projects", "crates/serving", "crates/workspace", "crates/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
devforge-debugger = { path = "crates/debugger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devforge-inspector = { path = "crates/inspector" }
devforge-core = { path = "crates/core" }
devforge-platform = { path = "crates/platform" }
devforge-runtime = { path = "crates/runtime" }
devforge-projects = { path = "crates/projects" }
devforge-serving = { path = "crates/serving" }
devforge-workspace = { path = "crates/workspace" }

[profile.release]
lto = "thin"
strip = true
