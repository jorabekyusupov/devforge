[workspace]
members = ["crates/core", "crates/platform", "crates/runtime", "crates/projects", "crates/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devforge-core = { path = "crates/core" }
devforge-platform = { path = "crates/platform" }
devforge-runtime = { path = "crates/runtime" }
devforge-projects = { path = "crates/projects" }

[profile.release]
lto = "thin"
strip = true
