[package]
name = "devforge-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
devforge-control-adapter.workspace = true
devforge-projects.workspace = true
devforge-workspace.workspace = true
devforge-runtime.workspace = true
devforge-control.workspace = true
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
devforge-core.workspace = true
getrandom = "0.4.3"
zeroize = "1.9.0"
subtle = "2.6.1"
devforge-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"
harness = false

[[test]]
name = "native_client"
path = "tests/native_client.rs"
harness = false
