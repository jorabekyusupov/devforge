[package]
name = "devforge-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
devforge-debugger.workspace=true
devforge-inspector.workspace = true
devforge-core.workspace = true
devforge-runtime.workspace = true
devforge-projects.workspace = true
devforge-serving.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
dunce = "1.0.5"
url = "2.5.8"
sha2 = "0.11.1"
zeroize = "1.9.0"
notify = "8.2.2"
[dev-dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
rcgen = "0.14.10"
mysql = {version="28.0.4",default-features=false,features=["minimal-rust"]}
reqwest = {version="0.13.5", default-features=false,features=["blocking","rustls","json"]}
devforge-platform.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61.2",features=["Win32_UI_Shell","Win32_UI_WindowsAndMessaging","Win32_Storage_FileSystem"]}
[features]
test-support = ["devforge-debugger/test-support"]

[[example]]
name="native_workspace"
required-features=["test-support"]

[[example]]
name="repro_smoke"
required-features=["test-support"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
