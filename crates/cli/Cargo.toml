[package]
name = "devforge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "devforge"
path = "src/main.rs"

[dependencies]
devforge-manager.workspace = true
devforge-debugger.workspace=true
devforge-inspector.workspace = true
devforge-core.workspace = true
devforge-platform.workspace = true
devforge-runtime.workspace = true
devforge-projects.workspace = true
devforge-serving.workspace = true
devforge-workspace.workspace = true
ctrlc = { version = "3.5.2", features = ["termination"] }
serde.workspace = true
serde_json.workspace = true
zeroize = "1.9.0"

[features]
test-support = ["devforge-workspace/test-support"]
e2e = ["test-support"]

[dev-dependencies]
sha2 = "0.11.1"
tempfile = "3.27.0"
